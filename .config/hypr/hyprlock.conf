# Hyprlock Configuration
# Note: Adjust the positions based on your setup (laptop vs desktop)

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor = 
    path = /home/abnv/Pictures/Wallpapers/kurotani.jpg
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# User box shape
shape {
    monitor = 
    size = 300, 50
    color = rgba(102, 92, 84, 0.33)
    rounding = 10
    border_color = rgba(255, 255, 255, 0)
    position = 0, 120  # Use 270 for desktop, 120 for laptop
    halign = center
    valign = bottom
}

# Time label
label {
    monitor = 
    text = cmd[update:1000] echo "$(date +'%k:%M')"
    color = rgba(235, 219, 178, 0.9)
    font_size = 115
    font_family = iosevka nerd font bold
    shadow_passes = 3
    position = 0, -25  # Use -150 for desktop, -25 for laptop
    halign = center
    valign = top
}

# Date label
label {
    monitor = 
    text = cmd[update:1000] echo "- $(date +'%A, %B %d') -"
    color = rgba(235, 219, 178, 0.9)
    font_size = 18
    font_family = iosevka nerd font
    shadow_passes = 3
    position = 0, -225  # Use -350 for desktop, -225 for laptop
    halign = center
    valign = top
}

# Username label
label {
    monitor = 
    text = $USER
    color = rgba(235, 219, 178, 1)
    font_size = 15
    font_family = iosevka nerd font bold
    position = 0, 131  # Use 281 for desktop, 131 for laptop
    halign = center
    valign = bottom
}

# Password input field
input-field {
    monitor = 
    size = 300, 50
    outline_thickness = 1
    rounding = 10
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(102, 92, 84, 0.33)
    inner_color = rgba(102, 92, 84, 0.33)
    font_color = rgba(235, 219, 178, 0.9)
    font_family = iosevka nerd font bold
    fade_on_empty = false
    placeholder_text = <i><span foreground="##fbf1c7">Enter Password</span></i>
    hide_input = false
    position = 0, 50  # Use 200 for desktop, 50 for laptop
    halign = center
    valign = bottom
}